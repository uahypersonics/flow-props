[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-props"
dynamic = ["version"]
description = "Extract flow properties from CFD data: boundary layer thickness, entropy layer thickness"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
authors = [
    {name = "Christoph Hader", email = "chader@arizona.edu"},
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["boundary-layer", "entropy-layer", "cfd", "flow-properties", "aerodynamics"]

dependencies = [
    "numpy>=1.24.0",
    "cfd-io>=0.2.0",
    "typer>=0.9.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "zensical",
]

[project.scripts]
flow-props = "flow_props.cli.app:app"

[project.urls]
Homepage = "https://github.com/uahypersonics/flow-props"
Repository = "https://github.com/uahypersonics/flow-props"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flow_props = ["examples/*.toml"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

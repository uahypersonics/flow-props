# Mach 5.3 ogive - isothermal wall (T_wall=300 K, T_inf=68 K)
# CFD++ structured grid (split format: .s8 + grid .s8)
# BL edge: htot_derivative (Bertin) criterion - robust for hypersonic body-fitted grids
# Reference: toolbox bl_properties_htot_deriv_criterion_ds_crit_01.dat

fname = "flow.s8"
gname = "grid.s8"

[stations]
x_s = 0.05
x_e = 0.70
dx  = 0.01

[bl]
criterion = "htot_derivative"
output    = "bl_properties_new.dat"

[gas]
gamma        = 1.4
gas_constant = 287.05

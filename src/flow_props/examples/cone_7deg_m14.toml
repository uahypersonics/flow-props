# 7-degree cone - Mach 14.4, Re1=12.1e6 m^-1
# CFD++ structured grid (split format: .s8 + grid .s8)
# BL edge: 99% velocity ratio criterion
# Reference: toolbox bl_properties_99pt00_pc_uvel_criterion_ds_crit_01.dat

fname = "base_flow_reconverged.s8"
gname = "grid_fd.s8"

[stations]
i_s = 1
i_e = 5000
di  = 10

[bl]
criterion = "velocity_ratio"
threshold = 0.99
output    = "bl_properties_new.dat"

[gas]
gamma        = 1.4
gas_constant = 287.05
